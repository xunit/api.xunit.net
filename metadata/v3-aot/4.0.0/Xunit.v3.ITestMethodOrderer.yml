  summary: >-
    A class implements this interface to participate in ordering tests for the test runner.

    Test method orderers are applied using an implementation of <xref href="v3-aot.4.0.0:Xunit.v3.ITestMethodOrdererAttribute" data-throw-if-not-resolved="false"></xref>

    (most commonly <xref href="v3-aot.4.0.0:Xunit.TestMethodOrdererAttribute" data-throw-if-not-resolved="false"></xref>), which can be applied at the assembly,

    test collection, and test class level.
