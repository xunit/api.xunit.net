  summary: >-
    Gets the test class's unique ID. Can be used to correlate test messages with the appropriate

    test class that they're related to. Will be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> if the test did not originate from a class.
