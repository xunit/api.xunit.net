  summary: >-
    This interface is intended to be implemented by components which generate test collections.

    End users specify the desired test collection factory by applying <xref href="v3-aot.4.0.0:Xunit.CollectionBehaviorAttribute" data-throw-if-not-resolved="false"></xref>

    at the assembly level. Classes which implement this interface must have a constructor that

    takes <xref href="v3-aot.4.0.0:Xunit.v3.ICodeGenTestAssembly" data-throw-if-not-resolved="false"></xref>.
