  assemblies:
  - xunit.v3.core.aot
  namespace: Xunit.v3
  summary: >-
    Gets the runtime skip reason for the test, inspecting the provided exception to see

    if it contractually matches a "dynamically skipped" exception (that is, any

    exception message that starts with <xref href="v3-aot.4.0.0:Xunit.v3.DynamicSkipToken.Value" data-throw-if-not-resolved="false"></xref> or any

    exception that matches a type from <xref href="v3-aot.4.0.0:Xunit.v3.ICoreTestCase.SkipExceptions" data-throw-if-not-resolved="false"></xref>).

    If the exception does not match either of these, delegates to <xref href="v3-aot.4.0.0:Xunit.v3.CoreTestRunnerContext%602.GetRuntimeSkipReason" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public override string? GetSkipReason(Exception? exception)
    parameters:
    - id: exception
      type: System.Exception
    return:
      type: System.String
      description: The skip reason, if the test is skipped; <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, otherwise
    content.vb: Public Overrides Function GetSkipReason(exception As Exception) As String
