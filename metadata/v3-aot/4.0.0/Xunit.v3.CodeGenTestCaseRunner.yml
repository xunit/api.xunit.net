    This entry point is used for both single-test (like <xref href="v3-aot.4.0.0:Xunit.FactAttribute" data-throw-if-not-resolved="false"></xref> and individual data

    rows for <xref href="v3-aot.4.0.0:Xunit.TheoryAttribute" data-throw-if-not-resolved="false"></xref> tests) and multi-test test cases (like <xref href="v3-aot.4.0.0:Xunit.TheoryAttribute" data-throw-if-not-resolved="false"></xref>

    when pre-enumeration is disable or the theory data was not serializable).
