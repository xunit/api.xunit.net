  assemblies:
  - xunit.v3.common.aot
  namespace: Xunit.Sdk
  summary: >-
    Returns the default value for the given type. For value types, this means a 0-initialized

    instance of the type; for reference types, this means <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  remarks: >-
    In Native AOT, this only supports reference types (which return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>)

    and known value types (which return default values). The known data types are:


    <ul><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">bool</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">byte</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/char">char</a></li><li><xref href="System.DateTime" data-throw-if-not-resolved="false"></xref></li><li><xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/floating-point-numeric-types">double</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/floating-point-numeric-types">float</a></li><li><xref href="System.Guid" data-throw-if-not-resolved="false"></xref></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">int</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">long</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">sbyte</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">short</a></li><li><xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">uint</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">ulong</a></li><li><a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/integral-numeric-types">ushort</a></li></ul>
  example: []
  syntax:
    content: public static object? GetDefaultValue(this Type type)
    parameters:
    - id: type
      type: System.Type
      description: The type to get the default value of.
    return:
      type: System.Object
      description: The default value for the given type.
    content.vb: Public Shared Function GetDefaultValue(type As Type) As Object
