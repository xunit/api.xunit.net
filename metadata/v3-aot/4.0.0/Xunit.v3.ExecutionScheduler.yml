  assemblies:
  - xunit.v3.core.aot
  namespace: Xunit.v3
  summary: >-
    Runs a task in sequence (that is, it will not be run at the same time as any other parallel or sequential

    task).
  remarks: >-
    This should only be invoked at the point where sequentialization has been requested; that is, anywhere

    that has been decorated with <code>DisableParallelization</code>, when the parallel mode is not <xref href="v3-aot.4.0.0:Xunit.Sdk.ParallelMode.None" data-throw-if-not-resolved="false"></xref>.

    When code is running in <xref href="v3-aot.4.0.0:Xunit.Sdk.ParallelMode.None" data-throw-if-not-resolved="false"></xref>, it is assumed that something <em>above this</em> in the stack

    has already put it into sequential mode (or the entire test assembly has disable parallelism, in which case there

    is no need to ever call this or <xref href="v3-aot.4.0.0:Xunit.v3.ExecutionScheduler.RunParallelTask%60%601(System.Func%7bSystem.Threading.Tasks.ValueTask%7b%60%600%7d%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>).
  example: []
