  assemblies:
  - xunit.v3.core.aot
  namespace: Xunit.v3
  summary: Create the execution scheduler appropriate for the given parameters.
  remarks: >-
    <p>The scheduler is chosen using the following rules:</p>

    <ul><li>If <code class="paramref">maxParallelThreads</code> is less than <code>0</code>, use the unlimited scheduler</li><li>If <code class="paramref">parallelAlgorithm</code> is <xref href="v3-aot.4.0.0:Xunit.Sdk.ParallelAlgorithm.Aggressive" data-throw-if-not-resolved="false"></xref>, use the aggressive scheduler</li><li>If <code class="paramref">parallelAlgorithm</code> is <xref href="v3-aot.4.0.0:Xunit.Sdk.ParallelAlgorithm.Conservative" data-throw-if-not-resolved="false"></xref>, use the conservative scheduler</li></ul>

    <p>Passing <code>0</code> for <code class="paramref">maxParallelThreads</code> will use <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public static ExecutionScheduler Create(int maxParallelThreads, ParallelAlgorithm parallelAlgorithm)
    parameters:
    - id: maxParallelThreads
      type: System.Int32
      description: The maximum number of parallel tasks
    - id: parallelAlgorithm
      type: Xunit.Sdk.ParallelAlgorithm
      description: The parallel algorithm used to limit the parallel tasks
    return:
      type: Xunit.v3.ExecutionScheduler
    content.vb: Public Shared Function Create(maxParallelThreads As Integer, parallelAlgorithm As ParallelAlgorithm) As ExecutionScheduler
