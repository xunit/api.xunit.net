    startLine: 154
  assemblies:
  - xunit.v3.core.aot
  namespace: Xunit.v3
  summary: >-
    Runs a task in parallel (that is, it can run in parallel with other tasks started via this function,

    but not against any other task started with <xref href="v3-aot.4.0.0:Xunit.v3.ExecutionScheduler.RunSequentialTask%60%601(System.Func%7bSystem.Threading.Tasks.ValueTask%7b%60%600%7d%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The specific implementation of this method will depend on the scheduler algorithm, and is used to

    limit the number of outstanding tasks. It should use <xref href="v3-aot.4.0.0:Xunit.v3.ExecutionScheduler.EnsureParallel%60%601(System.Func%7bSystem.Threading.Tasks.ValueTask%7b%60%600%7d%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> to guarantee that the

    parallel task is immediately launched into the background.</p>

    <p>This should only be invoked at the bottom level of parallelism; that is, in the test assembly runner when

    parallelizing test collections for <xref href="v3-aot.4.0.0:Xunit.Sdk.ParallelMode.Collections" data-throw-if-not-resolved="false"></xref>, or in the test runner when parallelizing

    tests for <xref href="v3-aot.4.0.0:Xunit.Sdk.ParallelMode.All" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public abstract ValueTask<T> RunParallelTask<T>(Func<ValueTask<T>> taskFactory, CancellationToken cancellationToken)
    parameters:
    - id: taskFactory
      type: System.Func{System.Threading.Tasks.ValueTask{{T}}}
      description: The parallel operation task
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token to run tasks with
    typeParameters:
    - id: T
    return:
      type: System.Threading.Tasks.ValueTask{{T}}
    content.vb: Public MustOverride Function RunParallelTask(Of T)(taskFactory As Func(Of ValueTask(Of T)), cancellationToken As CancellationToken) As ValueTask(Of T)
  overload: v3-aot.4.0.0:Xunit.v3.ExecutionScheduler.RunParallelTask*
