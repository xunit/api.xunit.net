      type: System.Func{System.Threading.Tasks.ValueTask{{T}}}
      description: The sequential operation task
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The cancellation token to run tasks with
    typeParameters:
    - id: T
    return:
      type: System.Threading.Tasks.ValueTask{{T}}
    content.vb: Public Overridable Function RunSequentialTask(Of T)(taskFactory As Func(Of ValueTask(Of T)), cancellationToken As CancellationToken) As ValueTask(Of T)
