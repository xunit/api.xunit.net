  summary: Ensures that a new task starts in the background.
  remarks: >-
    This uses either <xref href="System.Threading.Tasks.Task.Run(System.Func%7bSystem.Threading.Tasks.Task%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> or <xref href="System.Threading.Tasks.TaskFactory%601.StartNew(System.Func%7b%600%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    to ensure that the task starts immediately backgrounded. Typically tasks will run on the caller's thread and won't return

    until the first time an <code>await</code> statement would cause them to sleep.
