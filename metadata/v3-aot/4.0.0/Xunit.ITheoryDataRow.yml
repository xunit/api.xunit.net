    path: ../src/xunit.v3.core/ITheoryDataRow.cs
    startLine: 50
  assemblies:
  - xunit.v3.core.aot
  namespace: Xunit
  summary: >-
    A value greater than zero marks the test as having a timeout, and gets or sets the

    timeout (in milliseconds). A non-<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> value here overrides any inherited value

    from the <xref href="v3-aot.4.0.0:Xunit.v3.IDataAttribute" data-throw-if-not-resolved="false"></xref> or the <xref href="v3-aot.4.0.0:Xunit.v3.ITheoryAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    WARNING: Using this with parallelization turned on will result in undefined behavior.

    Timeout is only supported when parallelization is disabled, either globally or with

    a parallelization-disabled test collection.
  example: []
  syntax:
    content: int? Timeout { get; }
    parameters: []
    return:
      type: System.Nullable{System.Int32}
    content.vb: ReadOnly Property Timeout As Integer?
  overload: v3-aot.4.0.0:Xunit.ITheoryDataRow.Timeout*
