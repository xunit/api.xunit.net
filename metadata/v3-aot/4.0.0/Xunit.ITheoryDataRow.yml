  summary: Determines whether the test from this theory data row should run in parallel against any other parallelizable tests.
  remarks: >-
    If this value is either <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>, it overrides the setting from

    the data attribute; if this value is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, then the value from the data attribute is

    used instead.
