    startLine: 28
  assemblies:
  - xunit.v3.core.aot
  namespace: Xunit
  summary: >-
    Gets the label to use for the data row. This value is used to help format the display name

    of the test.
  remarks: >-
    * If the value is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> (or not set), use the default behavior: <code>MethodName(...argument list...)</code><br />

    * If the value is an empty string, use just the method name: <code>MethodName</code><br />

    * For any other values, appends the label: <code>MethodName [label]</code>
  example: []
  syntax:
    content: string? Label { get; }
    parameters: []
    return:
      type: System.String
    content.vb: ReadOnly Property Label As String
  overload: v3-aot.4.0.0:Xunit.ITheoryDataRow.Label*
