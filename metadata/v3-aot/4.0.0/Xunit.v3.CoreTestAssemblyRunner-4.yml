  namespace: Xunit.v3
  summary: Runs the list of test collections. By default, groups the tests by collection and runs them synchronously.
  remarks: >-
    This method runs during <xref href="v3-aot.4.0.0:Xunit.TestEngineStatus.Running" data-throw-if-not-resolved="false"></xref> and any exceptions thrown will

    contribute to test assembly cleanup failure.
  example: []
  syntax:
    content: protected override ValueTask<RunSummary> RunTestCollections(TContext ctxt, Exception? exception)
    parameters:
    - id: ctxt
      type: '{TContext}'
      description: The context that describes the current test assembly
    - id: exception
      type: System.Exception
      description: >-
        The exception that was caused during startup; should be used as an indicator that the
            downstream tests should fail with the provided exception rather than going through standard execution
    return:
      type: System.Threading.Tasks.ValueTask{Xunit.v3.RunSummary}
      description: Returns summary information about the tests that were run.
