  namespace: Xunit.v3
  summary: >-
    Orders the test collections using the first available orderer from:


    <ul><li><xref href="v3-aot.4.0.0:Xunit.v3.ICoreTestAssembly.TestCollectionOrderer" data-throw-if-not-resolved="false"></xref></li><li><xref href="v3-aot.4.0.0:Xunit.v3.DefaultTestCollectionOrderer" data-throw-if-not-resolved="false"></xref></li></ul>
  remarks: >-
    Override this to provide custom test collection ordering.<br />

    <br />

    This method runs during <xref href="v3-aot.4.0.0:Xunit.TestEngineStatus.Running" data-throw-if-not-resolved="false"></xref> and any exceptions thrown will

    contribute to test assembly failure.
  example: []
  syntax:
    content: protected override List<(TTestCollection Collection, List<TTestCase> TestCases)> OrderTestCollections(TContext ctxt)
    parameters:
    - id: ctxt
      type: '{TContext}'
      description: The context that describes the current test assembly
    return:
      type: System.Collections.Generic.List{System.ValueTuple{{TTestCollection},System.Collections.Generic.List{{TTestCase}}}}
      description: Test collections in run order (and associated, not-yet-ordered test cases).
