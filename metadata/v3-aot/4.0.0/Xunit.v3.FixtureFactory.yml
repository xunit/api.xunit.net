  - xunit.v3.core.aot
  namespace: Xunit.v3
  summary: Describes a fixture factory function.
  remarks: >-
    The <code class="paramref">forceCreation</code> flag is used to indicate that the fixture should always be

    created; this will be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> during initialization if fixture pre-creation is

    requested, and during any call to <xref href="v3-aot.4.0.0:Xunit.v3.FixtureMappingManager" data-throw-if-not-resolved="false"></xref> to get the actual fixture

    value. The factory should use a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> value to determine whether to create the

    fixture based on whether it's decorated with <xref href="v3-aot.4.0.0:Xunit.v3.INotifyLifecycle" data-throw-if-not-resolved="false"></xref>, in which case we need

    to ensure the fixture gets created even for cases where it wouldn't normally get created (for example,

    when used in a static test class) so that the fixture can subscribe to test lifecycle events.<br />

    <br />

    This logic is left to the fixture factory, since the source generator should be able to make this

    decision without resorting to reflection.<br />
  example: []
  syntax:
    content: public delegate ValueTask<object?> FixtureFactory(FixtureMappingManager? parentMappingManager, bool forceCreation)
    parameters:
    - id: parentMappingManager
      type: Xunit.v3.FixtureMappingManager
      description: The parent mapping manager, if there is one
    - id: forceCreation
      type: System.Boolean
      description: A flag to indicate creation should be forced
    return:
      type: System.Threading.Tasks.ValueTask{System.Object}
      description: The fixture if it was created, or else returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    content.vb: Public Delegate Function FixtureFactory(parentMappingManager As FixtureMappingManager, forceCreation As Boolean) As ValueTask(Of Object)
