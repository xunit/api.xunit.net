    timeout (in milliseconds). A non-<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> value here overrides any inherited value

    from the <xref href="v3-aot.4.0.0:Xunit.v3.DataAttribute" data-throw-if-not-resolved="false"></xref> or the <xref href="v3-aot.4.0.0:Xunit.TheoryAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
