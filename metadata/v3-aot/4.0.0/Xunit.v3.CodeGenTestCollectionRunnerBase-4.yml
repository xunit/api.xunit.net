  summary: >-
    This method will be called before the test collection has started running. By default this sends

    <xref href="v3-aot.4.0.0:Xunit.v3.TestCollectionStarting" data-throw-if-not-resolved="false"></xref>. Override this to enable any extensibility related to test

    collection start.
  remarks: >-
    This method runs during <xref href="v3-aot.4.0.0:Xunit.TestEngineStatus.Initializing" data-throw-if-not-resolved="false"></xref> and any exceptions thrown will

    contribute to test collection failure (and will prevent the test collection from running). Even if

    this method records exceptions, <xref href="v3-aot.4.0.0:Xunit.v3.TestCollectionRunner%604.OnTestCollectionFinished(%600%2cXunit.v3.RunSummary)" data-throw-if-not-resolved="false"></xref> will be called.
