  summary: Finds tests inside an assembly. Calls the callback for each discovered test.
  example: []
  syntax:
    content: public override ValueTask Find(Func<ITestCase, ValueTask<bool>> callback, ITestFrameworkDiscoveryOptions discoveryOptions, Type[]? types = null, CancellationToken? cancellationToken = null)
    parameters:
    - id: callback
      type: System.Func{Xunit.Sdk.ITestCase,System.Threading.Tasks.ValueTask{System.Boolean}}
      description: >-
        Called for each discovered test. Return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> to continue test
            discovery; return <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to cancel test discovery.
    - id: discoveryOptions
      type: Xunit.Sdk.ITestFrameworkDiscoveryOptions
      description: The options used by the test framework during discovery.
    - id: types
      type: System.Type[]
      description: >-
        When passed a non-<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> collection, only returns tests found
            from one of the provided types; when passed a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> collection, discovers all
            tests in the assembly.
    - id: cancellationToken
      type: System.Nullable{System.Threading.CancellationToken}
      description: >-
        The optional cancellation token which can be used to cancel the test
            discovery process.
    return:
      type: System.Threading.Tasks.ValueTask
