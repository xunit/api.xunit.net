  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: Gets the display text for the reason a test that might being skipped.
  remarks: >-
    This differs from the contract of <xref href="v3.4.0.0:Xunit.Sdk.ITestCaseMetadata.SkipReason" data-throw-if-not-resolved="false"></xref> by virtue

    of the fact that when this value is non-<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, it may indicate that a test is

    statically skipped (if both <code>SkipUnless</code> and <code>SkipWhen</code> are

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>) or dynamically skipped (if one is non-<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>).
