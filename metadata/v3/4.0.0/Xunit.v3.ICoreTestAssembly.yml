  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: >-
    Gets the maximum number of threads to use when running tests in parallel. If this returns a

    positive integer, that is the maximum number of threads; if it returns -1, that indicates that

    unlimited threads should be allowed.
  remarks: If this returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, the default value will be used (typically <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: int? MaxParallelThreads { get; }
    parameters: []
    return:
      type: System.Nullable{System.Int32}
    content.vb: ReadOnly Property MaxParallelThreads As Integer?
  overload: v3.4.0.0:Xunit.v3.ICoreTestAssembly.MaxParallelThreads*
