  namespace: Xunit.v3
  summary: Runs the test class via the context (after validating that it's not <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>).
  remarks: >-
    This method runs during <xref href="v3.4.0.0:Xunit.TestEngineStatus.Running" data-throw-if-not-resolved="false"></xref> and any exceptions thrown will

    contribute to test collection cleanup failure.
  example: []
  syntax:
    content: protected override ValueTask<RunSummary> RunTestClass(TContext ctxt, TTestClass? testClass, IReadOnlyCollection<TTestCase> testCases)
    parameters:
    - id: ctxt
      type: '{TContext}'
      description: The context that describes the current test collection
    - id: testClass
      type: '{TTestClass}'
      description: >-
        The test class to be run. May be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> for test cases that do not
            support classes and methods.
    - id: testCases
      type: System.Collections.Generic.IReadOnlyCollection{{TTestCase}}
      description: The test cases to be run.
    return:
      type: System.Threading.Tasks.ValueTask{Xunit.v3.RunSummary}
      description: Returns summary information about the tests that were run.
