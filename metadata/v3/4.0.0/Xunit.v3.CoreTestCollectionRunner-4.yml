  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: >-
    Orders the test classes using the first available orderer from:


    <ul><li><xref href="v3.4.0.0:Xunit.v3.ICoreTestCollection.TestClassOrderer" data-throw-if-not-resolved="false"></xref></li><li><xref href="v3.4.0.0:Xunit.v3.ICoreTestAssembly.TestClassOrderer" data-throw-if-not-resolved="false"></xref></li><li><xref href="v3.4.0.0:Xunit.v3.DefaultTestClassOrderer" data-throw-if-not-resolved="false"></xref></li></ul>
  remarks: >-
    Override this to provide custom test class ordering.<br />

    <br />

    This method runs during <xref href="v3.4.0.0:Xunit.TestEngineStatus.Running" data-throw-if-not-resolved="false"></xref> and any exceptions thrown will

    contribute to test collection failure.
  example: []
  syntax:
    content: protected override List<(TTestClass? Class, List<TTestCase> TestCases)> OrderTestClasses(TContext ctxt)
    parameters:
    - id: ctxt
      type: '{TContext}'
      description: The context that describes the current test collection
    return:
      type: System.Collections.Generic.List{System.ValueTuple{{TTestClass},System.Collections.Generic.List{{TTestCase}}}}
      description: Test classes in run order (and associated, not-yet-ordered test cases).
