  summary: >-
    Used to decorate xUnit.net test assemblies to indicate the availability of a custom

    result writer (in console mode). This will add a command line switch for the writer

    as <code>"-result-{ID}"</code>. The writer type must implement <xref href="v3.4.0.0:Xunit.Runner.Common.IConsoleResultWriter" data-throw-if-not-resolved="false"></xref>.
  remarks: Result writer registration attributes are only valid at the assembly level.
