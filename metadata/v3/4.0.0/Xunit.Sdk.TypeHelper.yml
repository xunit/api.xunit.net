  summary: Attempts to convert a value to type <code class="typeparamref">T</code>.
  remarks: >-
    This method is typically used for argument coercion by source generators. The steps it takes include:


    <ul><li>If <code class="paramref">arg</code> is already the correct type, returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> with <code class="paramref">result</code>

    set to <code class="paramref">arg</code></li><li>If <code class="typeparamref">T</code> is an enum, calls <xref href="System.Enum.ToObject(System.Type%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> and returns

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> with <code class="paramref">result</code> set to the converted value</li><li>If <code class="paramref">arg</code> is <xref href="System.String" data-throw-if-not-resolved="false"></xref> and <code class="typeparamref">T</code> is one of <xref href="System.Guid" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref>, or <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref>, tries to parse the string value, and if successful,

    returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> with <code class="paramref">result</code> set to the converted value</li><li>If <xref href="System.Convert.ChangeType(System.Object%2cSystem.Type%2cSystem.IFormatProvider)" data-throw-if-not-resolved="false"></xref> can convert the item to the target type,

    returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> with <code class="paramref">result</code> set to the converted value</li><li>Returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> with <code class="paramref">result</code> set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a></li></ul>


    Notably, this does not support implicit or explicit conversion operator methods, which are not available via reflection

    in Native AOT.
  example: []
  syntax:
    content: public static bool TryConvert<T>(object? arg, out T result)
    parameters:
    - id: arg
      type: System.Object
      description: The value to try to convert
    - id: result
      type: '{T}'
      description: >-
        The resulting converted value, if the return value is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>
            (or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a> if the return value is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>).
    typeParameters:
    - id: T
      description: The desired destination type
    return:
      type: System.Boolean
    content.vb: Public Shared Function TryConvert(Of T)(arg As Object, result As T) As Boolean
