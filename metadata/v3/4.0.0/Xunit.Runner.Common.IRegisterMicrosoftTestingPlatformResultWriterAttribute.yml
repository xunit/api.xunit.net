  namespace: Xunit.Runner.Common
  summary: >-
    Used to decorate xUnit.net test assemblies to indicate the availability of a custom

    result writer (in Microsoft Testing Platform mode). This will add command line switches

    for the writer as <code>"--xunit-result-{ID}"</code> and <code>"--xunit-result-{ID}-filename"</code>.

    The writer type must implement <xref href="v3.4.0.0:Xunit.Runner.Common.IMicrosoftTestingPlatformResultWriter" data-throw-if-not-resolved="false"></xref>.
  remarks: Result writer registration attributes are only valid at the assembly level.
  example: []
  syntax:
    content: 'public interface IRegisterMicrosoftTestingPlatformResultWriterAttribute : IRegisterResultWriterAttribute'
    content.vb: Public Interface IRegisterMicrosoftTestingPlatformResultWriterAttribute Inherits IRegisterResultWriterAttribute
