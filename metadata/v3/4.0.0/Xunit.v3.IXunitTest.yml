  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: >-
    When set, indicates a public static property that is used at runtime to determine

    whether the test is skipped or not (<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> to run, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to skip).
  remarks: >-
    Note: It is an error condition for both <xref href="v3.4.0.0:Xunit.v3.IXunitTest.SkipUnless" data-throw-if-not-resolved="false"></xref> and <xref href="v3.4.0.0:Xunit.v3.IXunitTest.SkipWhen" data-throw-if-not-resolved="false"></xref>

    to return a non-<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> value.<br />

    <br />

    This value may not line up the with <xref href="v3.4.0.0:Xunit.v3.IXunitTestCase.SkipUnless" data-throw-if-not-resolved="false"></xref>, as you can skip

    individual data rows during delay enumeration.
  example: []
  syntax:
    content: string? SkipUnless { get; }
    parameters: []
    return:
      type: System.String
    content.vb: ReadOnly Property SkipUnless As String
  overload: v3.4.0.0:Xunit.v3.IXunitTest.SkipUnless*
