  namespace: Xunit.v3
  summary: >-
    A class implements this interface to participate in ordering tests for the test runner.

    Test class orderers are applied using an implementation of <xref href="v3.4.0.0:Xunit.v3.ITestClassOrdererAttribute" data-throw-if-not-resolved="false"></xref>

    (most commonly <xref href="v3.4.0.0:Xunit.TestClassOrdererAttribute" data-throw-if-not-resolved="false"></xref>), which can be applied at the assembly and

    test collection level.
