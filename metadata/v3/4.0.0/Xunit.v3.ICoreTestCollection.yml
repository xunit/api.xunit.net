  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: Represents a test collection from xUnit.net v3.
  remarks: >-
    Test collections form the basis of the parallelization in xUnit.net v3. Test cases

    which are in the same test collection will not be run in parallel against sibling

    tests, but will run in parallel against tests in other collections. They also provide

    a level of shared context via <xref href="v3.4.0.0:Xunit.ICollectionFixture%601" data-throw-if-not-resolved="false"></xref>.<br />

    <br />

    This interface is shared between reflection-based and code generation-based tests.
  example: []
  syntax:
    content: 'public interface ICoreTestCollection : ITestCollection, ITestCollectionMetadata'
    content.vb: Public Interface ICoreTestCollection Inherits ITestCollection, ITestCollectionMetadata
