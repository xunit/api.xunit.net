  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: >-
    Orders the test methods using the first available orderer from:


    <ul><li><xref href="v3.4.0.0:Xunit.v3.ICoreTestClass.TestMethodOrderer" data-throw-if-not-resolved="false"></xref></li><li><xref href="v3.4.0.0:Xunit.v3.ICoreTestCollection.TestMethodOrderer" data-throw-if-not-resolved="false"></xref></li><li><xref href="v3.4.0.0:Xunit.v3.ICoreTestAssembly.TestMethodOrderer" data-throw-if-not-resolved="false"></xref></li><li><xref href="v3.4.0.0:Xunit.v3.DefaultTestClassOrderer" data-throw-if-not-resolved="false"></xref></li></ul>
  remarks: >-
    Override this to provide custom test method ordering.<br />

    <br />

    This method runs during <xref href="v3.4.0.0:Xunit.TestEngineStatus.Running" data-throw-if-not-resolved="false"></xref> and any exceptions thrown will

    contribute to test class failure.
  example: []
  syntax:
    content: protected override List<(TTestMethod? Method, List<TTestCase> TestCases)> OrderTestMethods(TContext ctxt)
    parameters:
    - id: ctxt
      type: '{TContext}'
      description: The context that describes the current test class
    return:
      type: System.Collections.Generic.List{System.ValueTuple{{TTestMethod},System.Collections.Generic.List{{TTestCase}}}}
      description: Test methods in run order (and associated, not-yet-ordered test cases).
