  summary: Gets the algorithm used for test parallelization.
  remarks: >-
    If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, the system will use <xref href="v3.4.0.0:Xunit.Sdk.ParallelAlgorithm.Conservative" data-throw-if-not-resolved="false"></xref>. This value

    will be ignored if <xref href="v3.4.0.0:Xunit.v3.IParallelizationAttribute.GetMode" data-throw-if-not-resolved="false"></xref> returns <xref href="v3.4.0.0:Xunit.Sdk.ParallelMode.None" data-throw-if-not-resolved="false"></xref>.
