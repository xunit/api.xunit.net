    startLine: 28
  assemblies:
  - xunit.v3.core
  namespace: Xunit.v3
  summary: Determines how many tests can run in parallel with each other.
  remarks: >-
    If <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> or <code>0</code>, the system will use <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref>; if

    a negative number, then there will be no limit to the number of threads (meaning, it uses the default

    thread pool). This value will be ignored if <xref href="v3.4.0.0:Xunit.v3.IParallelizationAttribute.GetMode" data-throw-if-not-resolved="false"></xref> returns <xref href="v3.4.0.0:Xunit.Sdk.ParallelMode.None" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: int? GetMaxThreads()
    return:
      type: System.Nullable{System.Int32}
    content.vb: Function GetMaxThreads() As Integer?
  overload: v3.4.0.0:Xunit.v3.IParallelizationAttribute.GetMaxThreads*
