  namespace: Xunit.Sdk
  summary: Enables parallelism at the test collection level.
  remarks: >-
    Test collections will be run in parallel against one another, but tests within

    the same test collection will be run serially.
  example: []
  syntax:
    content: Collections = 1
    return:
      type: Xunit.Sdk.ParallelMode
